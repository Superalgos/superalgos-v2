[project]
name = "superalgos-v2"
version = "0.1.0"
description = "Superalgos v2 workspace root (not published)"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

# ---------------------------------------------------------------- shared tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src", "packages/*/tests", "apps/*/src", "apps/*/tests", "tests/e2e"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "SIM", "RUF", "C4", "PT", "PL"]
ignore = [
    "E501",  # `ruff format` owns line length; long f-string error messages are fine
    "PLR0913",  # many keyword args are normal for pydantic-style constructors
    "PLR2004",  # magic values: protocol constants are named where they matter
    "PLR0917",
    "ASYNC109",  # timeouts are enforced with asyncio.timeout inside
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S311", "S603", "PLC0415", "PLR0124", "PT018", "PT012", "RUF043", "SLF001", "PLW0108"]

[tool.ruff.lint.isort]
known-first-party = ["sa_core", "sa_engine", "sa_cli", "sa_api", "e2e_net", "e2e_scenario", "e2e_tsa", "tsa_lab"]

[tool.mypy]
strict = true
python_version = "3.13"
explicit_package_bases = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["opentimestamps", "opentimestamps.*", "asn1crypto", "asn1crypto.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# NautilusTrader ships compiled modules without type stubs.
module = ["nautilus_trader", "nautilus_trader.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The only four modules that touch Nautilus classes (subclassing Any, untyped calls). Everything
# else in every package stays fully `--strict`.
module = ["sa_engine.compile", "sa_engine.catalog", "sa_engine.backtest", "sa_engine.paper"]
disallow_subclassing_any = false
disallow_untyped_calls = false
warn_return_any = false
disallow_any_unimported = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A bare `uv run pytest` runs every Python package's tests in one process with one combined coverage gate
# (`fail_under` below). Test helper modules have package-unique names (core_helpers, cli_support, ...) so
# nothing collides. e2e tests start real processes and are `make e2e`; online tests need SA_ONLINE=1 and
# `-m online`. `make test` runs the per-package gates and overrides addopts (`-o addopts=...`).
testpaths = ["packages", "apps"]
addopts = "--strict-markers -ra -m 'not slow and not online' --cov=sa_core --cov=sa_engine --cov=sa_cli --cov=sa_api --cov-report=term:skip-covered"
filterwarnings = ["ignore:The .generic. unit for NumPy timedelta:DeprecationWarning"]
markers = [
    "online: touches the network (public RPC, OTS calendars, public TSAs); skipped unless SA_ONLINE=1",
    "e2e: runs real processes (sarelay, provider, followers); `make e2e`",
    "slow: slow test, still offline",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.$",
]
