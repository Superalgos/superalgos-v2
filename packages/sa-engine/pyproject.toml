[project]
name = "sa-engine"
version = "0.1.0"
description = "Superalgos v2 engine: strategy schema + DSL, Nautilus compile, data, backtest, paper trading"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
dependencies = [
  "sa-core",
  "websockets>=13",
  "nautilus_trader>=1.231,<1.232",
  "pydantic>=2.7",
  "pandas>=2.3,<3",
  "numpy>=1.26",
  "httpx>=0.27",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.10",
  "pandas-stubs",
  "jsonschema>=4.22",
  "types-jsonschema",
]

[tool.uv.sources]
sa-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sa_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: heavy backtests on real data (needs downloaded data)",
  "online: needs network access (Binance public endpoints)",
  "testnet: needs a Binance spot testnet API key (SA_BINANCE_TESTNET_API_KEY / _SECRET); implies online",
]
addopts = "-m 'not slow and not online'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore:The .generic. unit for NumPy timedelta:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are used for type narrowing of invariants
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "E501"]  # long literals in test data read better unwrapped
