[project]
name = "sa-core"
version = "0.1.0"
description = "Superalgos v2 core: models, keys, Nostr, delegation, chains, power, anchors, bundles, track record, governance"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
dependencies = [
    "pycryptodome>=3.20",
    "eth-account>=0.13",
    "httpx>=0.27",
    "opentimestamps>=0.4.5",
    "pydantic>=2.8",
    "websockets>=13",
    "coincurve>=21",
    "asn1crypto>=1.5.1",
    "cryptography>=46",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"
