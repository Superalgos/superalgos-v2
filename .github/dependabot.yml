# Dependency updates (SEP-1.18). Every dependency is pinned: uv.lock, web/bun.lock and relay/go.sum carry hashes, images
# are pinned by digest and actions by commit SHA. Dependabot proposes the moves; CI and a reviewer accept them.
# The cooldown keeps a release out until it is 7 days old, so a hijacked or broken release is usually pulled first.
# nautilus_trader is held below 1.232 in packages/sa-engine: its 2.0.0 PR is the trigger for the migration (SEP-1.19).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-minor:
        update-types: [minor, patch]
    ignore:
      # NautilusTrader 1.231's BarDataWrangler fails on pandas 3 ("buffer source array is read-only"; packages/sa-engine
      # pins pandas<3). Lift together with the NautilusTrader 2.x move (SEP-1.19).
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]

  - package-ecosystem: bun
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      web-minor:
        update-types: [minor, patch]

  - package-ecosystem: gomod
    directory: /relay
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      go-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # The image's Python follows requires-python (<3.14 in every package), not the other way round. CI does not build
      # deploy/Dockerfile yet (SEP-1.14), so a green check on this bump would prove nothing. Lift with the bound.
      - dependency-name: python
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # Every action is pinned on adjacent lines of ci.yml: separate PRs conflict with each other after the first merge.
      actions:
        patterns: ["*"]
